<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 84 84" role="img" aria-label="Bundestrack">
  <title>Bundestrack</title>
  <!--
    The Bundesadler in a gold ring, on white.

    It is a rebuild rather than a trace, and that was measured rather than
    assumed. The official coat of arms is mostly negative space — hairline slots
    between the pinions — so scaling it down closes those slots and leaves a
    blob, and thickening the strokes to survive closes them faster. The
    Bundestag's own site is the proof: it serves a single 16×16 ICO of its logo,
    and at that size it is an illegible smudge.

    What is kept is what makes the bird *this* bird: the small head in profile
    facing the viewer's left, the flat shoulder line with the wings spread the
    full width, three separated pinions a side, and a body tapering to two
    talons. The proportions come from an ink mask of the official artwork — the
    wing band spans the full width across the middle third, and the mass below
    it narrows in three steps to the tail.

    ## Why the viewBox starts at -10 rather than 0

    The eagle is drawn on a 16×16 grid: every edge is a multiple of 4, in the
    0–64 range the path coordinates still use. It was previously framed at
    exactly `0 0 64 64`, and the reason was pixel alignment — at the 16 px a
    browser tab asks for, one 4-unit grid cell landed on exactly one device
    pixel, so the tile resolved to two colours with no antialiased midtones and
    the three pinions per wing stayed readable as three.

    The ring is not compatible with that, and the conflict is arithmetic rather
    than a matter of taste. The wings span x 4→60, so the outermost corners of
    the artwork sit 32.25 units from the centre — *past* the 32-unit half-width
    of the old tile. There is no circle that both encloses this eagle and fits
    in a 64-unit box, so a ring costs the artwork margin either way. And the
    grid guarantee survives only at a tile of 64, 32 or 16 units, since those
    are the only widths where 16 px divides the 4-unit module into whole pixels.
    Ring and guarantee cannot both hold. The ring was asked for, so it wins, and
    this note replaces the claim it invalidates.

    The margin is taken by widening the viewBox rather than by scaling the path,
    which keeps the `d` attribute below byte-identical to the copy in
    components/brand-mark.tsx. Those two are deliberately duplicated and must be
    edited together; identical strings are the only cheap way to see that they
    have not drifted.

    Geometry, so the clearances are checkable rather than eyeballed: the ring's
    inner edge is at r 34.75, which clears the eagle's 32.25 by 2.5 units, and
    its outer edge at 39.25 leaves 2.75 units to the tile edge at 42.

    ## Why the ring is load-bearing on a white tile

    A white tile on the light browser chrome most people run has no boundary of
    its own — without the ring the favicon is not a tile at all, it is a gold
    bird floating in the tab strip. The ring is what gives it an edge, which is
    why it is drawn in the brand gold rather than in a neutral hairline.

    Note the trade this makes: #c59f3a on #ffffff is 2.5:1, against 7.4:1 for
    the same gold on the near-black tile this replaces. app/globals.css sets out
    why that number is what it is — the brand gold is a fill ratio, not a mark
    ratio — and carries a darker ink tier (the `gold` token, 4.5:1 on paper, as
    against the `gold-brand` used here; both are written with the CSS custom
    property prefix over there, which cannot be reproduced inside an XML comment)
    for exactly
    this case. The favicon cannot reference a CSS token, so if the eagle reads
    thin in a light tab, the fix is to hardcode the ink gold here for the path
    and keep the brand gold for the ring.
  -->
  <rect x="-10" y="-10" width="84" height="84" rx="17" fill="#ffffff"/>
  <circle cx="32" cy="32" r="37" fill="none" stroke="#c59f3a" stroke-width="4.5"/>
  <path
    fill="#c59f3a"
    d="M24 4h12v4h-12ZM16 8h20v4h-20ZM28 12h8v8h-8ZM4 16h16v4h-16ZM44 16h16v4h-16ZM4 20h56v8h-56ZM4 28h4v16h-4ZM12 28h4v20h-4ZM24 28h16v20h-16ZM48 28h4v20h-4ZM56 28h4v16h-4ZM12 48h8v4h-8ZM28 48h8v12h-8ZM44 48h8v4h-8ZM12 52h4v4h-4ZM48 52h4v4h-4Z"
  />
</svg>
