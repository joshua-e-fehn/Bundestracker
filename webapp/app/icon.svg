<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bundestrack">
  <title>Bundestrack</title>
  <!--
    The Bundesadler, redrawn on a 16×16 grid.

    Every edge is a multiple of 4 in this 64-unit viewBox, so at the 16 px a
    browser tab actually asks for, one grid cell is exactly one device pixel and
    no edge lands on a half-pixel. That is the whole constraint, and it is not a
    stylistic preference: rendered at 16 px this file resolves to two colours
    with no antialiased midtones anywhere inside the tile, which is what keeps
    the three pinions per wing readable as three rather than as one bar.

    It is a rebuild rather than a trace, and that was measured rather than
    assumed. The official coat of arms is mostly negative space — hairline slots
    between the pinions — so scaling it down closes those slots and leaves a
    blob, and thickening the strokes to survive closes them faster. The
    Bundestag's own site is the proof: it serves a single 16×16 ICO of its logo,
    and at that size it is an illegible smudge.

    What is kept is what makes the bird *this* bird: the small head in profile
    facing the viewer's left, the flat shoulder line with the wings spread the
    full width, three separated pinions a side, and a body tapering to two
    talons. The proportions come from an ink mask of the official artwork — the
    wing band spans the full width across the middle third, and the mass below
    it narrows in three steps to the tail.

    components/brand-mark.tsx carries the same eagle for use inside the page;
    the two are deliberately duplicated and must be edited together.
  -->
  <rect width="64" height="64" rx="13" fill="#131311"/>
  <path
    fill="#c59f3a"
    d="M24 4h12v4h-12ZM16 8h20v4h-20ZM28 12h8v8h-8ZM4 16h16v4h-16ZM44 16h16v4h-16ZM4 20h56v8h-56ZM4 28h4v16h-4ZM12 28h4v20h-4ZM24 28h16v20h-16ZM48 28h4v20h-4ZM56 28h4v16h-4ZM12 48h8v4h-8ZM28 48h8v12h-8ZM44 48h8v4h-8ZM12 52h4v4h-4ZM48 52h4v4h-4Z"
  />
</svg>
