[project]
name = "bundestrack-pipeline"
version = "0.1.0"
description = "Fetches Bundestag Open Data and ingests it into Convex."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
bundestrack = "bundestrack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bundestrack"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

# --- Ruff -------------------------------------------------------------------
# Ruff both lints and formats; there is no Black in this repo.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["bundestrack"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
